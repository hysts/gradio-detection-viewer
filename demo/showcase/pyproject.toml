[project]
name = "showcase"
version = "0.1.0"
description = "Preset examples demo for detection-viewer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "detection-viewer",
]

[tool.uv.sources]
detection-viewer = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.15.1",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"app.py" = ["INP001"]
