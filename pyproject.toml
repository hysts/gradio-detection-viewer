[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detection-viewer"
version = "0.1.0"
description = "A Gradio custom HTML component for visualizing object detection results — bounding boxes, segmentation masks, human pose keypoints, skeleton connections, and confidence scores"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/detection_viewer"]

[tool.ruff]
line-length = 119
exclude = ["*.pyi"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # missing-trailing-comma
    "D203",   # one-blank-line-before-class
    "D213",   # multi-line-summary-second-line
    "E501",   # line-too-long
    "SIM117", # multiple-with-statements
    #
    "D100",    # undocumented-public-module
    "D101",    # undocumented-public-class
    "D102",    # undocumented-public-method
    "D103",    # undocumented-public-function
    "D104",    # undocumented-public-package
    "D105",    # undocumented-magic-method
    "D107",    # undocumented-public-init
    "EM101",   # raw-string-in-exception
    "FBT001",  # boolean-type-hint-positional-argument
    "FBT002",  # boolean-default-value-positional-argument
    "ISC001",  # single-line-implicit-string-concatenation
    "PGH003",  # blanket-type-ignore
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    "TRY003",  # raise-vanilla-args
]
unfixable = [
    "F401", # unused-import
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"demo/*.py" = ["INP001"]

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]
